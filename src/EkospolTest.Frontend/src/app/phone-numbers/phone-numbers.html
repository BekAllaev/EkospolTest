<form class="add-form" (ngSubmit)="add()">
  <input name="number" [(ngModel)]="number" placeholder="+420 123 456 789" required />
  <label>
    <input type="checkbox" name="isPublic" [(ngModel)]="isPublic" />
    Публичный
  </label>
  <button type="submit" [disabled]="!number.trim()">Добавить</button>
</form>

@if (error()) {
  <p class="error">{{ error() }}</p>
}

<table>
  <thead>
    <tr>
      <th>Номер</th>
      <th>Публичный</th>
      <th>Владелец</th>
    </tr>
  </thead>
  <tbody>
    @for (phoneNumber of phoneNumbers(); track phoneNumber.id) {
      <tr>
        <td>{{ phoneNumber.number }}</td>
        <td>{{ phoneNumber.isPublic ? 'Да' : 'Нет' }}</td>
        <td>{{ phoneNumber.ownerId }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="3">Номеров пока нет.</td>
      </tr>
    }
  </tbody>
</table>
